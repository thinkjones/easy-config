# This repo is the source of ezc (cli/), a Go CLI. `direnv allow` puts its
# bin/ezc shim on PATH; ezc keeps its data in EZC_HOME. See README.md.

[tools]
lefthook = "2.1.14"

# The local gate's hooks are written when mise installs this project's tools
# and when a shell enters the project, so a fresh clone is guarded without a
# command to run. scripts/install-hooks.sh puts them in the directory git runs
# hooks from and never overwrites a hook file another tool owns.
[hooks]
postinstall = "sh scripts/install-hooks.sh"
enter = "sh scripts/install-hooks.sh"

[tasks."hooks:install"]
description = "Write the local gate into the hooks git runs (mise does this itself)"
run = "sh scripts/install-hooks.sh"

[tasks."cli:build"]
description = "Build ezc into cli/bin/ (bin/ezc also does this on demand)"
dir = "cli"
run = "go build -o bin/ezc ./cmd/ezc"

[tasks."cli:test"]
description = "gofmt check, go vet, go test — what a change to cli/ must pass"
dir = "cli"
run = [
  'test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt: the files above need gofmt -w" >&2; exit 1; }',
  "go vet ./...",
  "go test ./...",
]

[tasks."cli:test:sops"]
description = "The cli:test gate with the real-sops and real-git tests required instead of skipped"
env = { EZC_REQUIRE_SOPS = "1", EZC_REQUIRE_GIT = "1" }
run = "mise run cli:test"

[tasks."schema:build"]
description = "Regenerate the committed manifest JSON Schema from the Go types"
depends = ["cli:build"]
run = "./cli/bin/ezc manifest schema -o cli/schema/v1/manifest.schema.json"

[tasks."schema:check"]
description = "Fail when the committed manifest JSON Schema is stale"
depends = ["cli:build"]
run = '''
tmp="$(mktemp)"
trap 'rm -f "$tmp"' EXIT
./cli/bin/ezc manifest schema -o "$tmp" >/dev/null || exit 1
diff -u cli/schema/v1/manifest.schema.json "$tmp" || { echo "cli/schema/v1/manifest.schema.json is stale — run: mise run schema:build" >&2; exit 1; }
'''

# GitHub has no config file for a repo's description and topics, so they are kept here: edit, then run this.
[tasks."github:about"]
description = "Set the GitHub repo's description and topics from the values in this task"
run = '''
gh repo edit thinkjones/easy-config --description "ezc (easy config): one git-backed store for secrets and variables, layered by environment into every repo. Encrypts secrets with SOPS + age, manages who can read them (join requests, user and CI bot keys), validates each repo's environment against a manifest and loads it through mise, direnv or ezc run. A Go CLI built with Cobra."
gh api -X PUT repos/thinkjones/easy-config/topics --silent \
  -f 'names[]=secrets-management' -f 'names[]=configuration-management' -f 'names[]=environment-variables' \
  -f 'names[]=dotenv' -f 'names[]=sops' -f 'names[]=age-encryption' -f 'names[]=encryption' \
  -f 'names[]=gitops' -f 'names[]=developer-tools' -f 'names[]=devops' -f 'names[]=cli' \
  -f 'names[]=go' -f 'names[]=golang' -f 'names[]=cobra' -f 'names[]=mise' -f 'names[]=direnv' \
  -f 'names[]=github-actions' -f 'names[]=json-schema' -f 'names[]=pydantic' -f 'names[]=access-control'
'''
