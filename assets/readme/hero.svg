<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">ezc: easy config</title>
  <desc id="desc">ezc keeps secrets and variables in one git-backed store and layers them into every repo. A terminal shows a secret being set in the store, the environment passing its check, and a command run with it.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#000000" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="4" fill="#f8fafc"/>
  <rect width="1200" height="400" rx="4" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="4" fill="none" stroke="#e2e8f0"/>

  <g id="title-block" transform="translate(56 0)">
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="3.6" fill="#e85d26">// EASY CONFIG</text>
    <text x="-6" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" letter-spacing="-6" fill="#0f172a">ezc</text>
    <text x="0" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="600" letter-spacing="-0.6" fill="#0f172a">One store for secrets and variables,</text>
    <text x="0" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="600" letter-spacing="-0.6" fill="#0f172a">layered into every repo.</text>
    <text x="0" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#475569">Go CLI · SOPS + age · git-backed</text>
  </g>

  <g id="project-proof" transform="translate(628 56)">
    <rect width="516" height="288" rx="4" fill="#1e293b"/>
    <rect width="516" height="40" rx="4" fill="#0f172a"/>
    <rect y="36" width="516" height="4" fill="#0f172a"/>
    <rect x="20" y="15" width="10" height="10" fill="#e85d26"/>
    <rect x="38" y="15" width="10" height="10" fill="#54C8CE"/>
    <rect x="56" y="15" width="10" height="10" fill="#94a3b8"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
      <text x="24" y="84" fill="#f8fafc"><tspan fill="#ffb59c">$</tspan> ezc set -g API_TOKEN</text>
      <text x="24" y="116" fill="#94a3b8">set API_TOKEN in store/common.enc.yaml</text>
      <text x="24" y="164" fill="#f8fafc"><tspan fill="#ffb59c">$</tspan> ezc env</text>
      <text x="24" y="196" fill="#94a3b8">environment local <tspan fill="#54C8CE">✓</tspan> 3 vars from 3 files</text>
      <text x="24" y="244" fill="#f8fafc"><tspan fill="#ffb59c">$</tspan> ezc run -- ./deploy.sh</text>
    </g>
  </g>
</svg>
