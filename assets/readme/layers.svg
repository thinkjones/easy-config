<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">How ezc composes an environment</title>
  <desc id="desc">Eight files load in order and a later file wins: the store's common.yaml, common.enc.yaml, env.name.yaml and env.name.enc.yaml, then the same four files of the repo. The result is checked against the repo's manifest.yaml, then reported, exported or given to a command.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#000000" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="4" fill="#f8fafc"/>
  <rect width="1200" height="500" rx="4" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="4" fill="none" stroke="#e2e8f0"/>

  <g transform="translate(56 0)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="0" y="62" font-size="18" letter-spacing="3.6" fill="#e85d26">// LATER WINS</text>

    <g id="store">
      <text x="0" y="118" fill="#0f172a" font-weight="600">01 // store</text>
      <text x="150" y="118" fill="#475569" font-family="Georgia, 'Times New Roman', serif">shared by every repo</text>
      <rect x="0" y="136" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="18" y="171" fill="#0f172a">common.yaml</text>
      <rect x="277" y="136" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="277" y="136" width="6" height="56" fill="#e85d26"/>
      <text x="295" y="171" fill="#0f172a">common.enc.yaml</text>
      <rect x="554" y="136" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="572" y="171" fill="#0f172a">env.&lt;name&gt;.yaml</text>
      <rect x="831" y="136" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="831" y="136" width="6" height="56" fill="#e85d26"/>
      <text x="849" y="171" fill="#0f172a">env.&lt;name&gt;.enc.yaml</text>
    </g>

    <g id="repo">
      <text x="150" y="238" fill="#0f172a" font-weight="600">02 // repo</text>
      <text x="288" y="238" fill="#475569" font-family="Georgia, 'Times New Roman', serif">this repo's own .ezc/</text>
      <rect x="0" y="256" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="18" y="291" fill="#0f172a">common.yaml</text>
      <rect x="277" y="256" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="277" y="256" width="6" height="56" fill="#e85d26"/>
      <text x="295" y="291" fill="#0f172a">common.enc.yaml</text>
      <rect x="554" y="256" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="572" y="291" fill="#0f172a">env.&lt;name&gt;.yaml</text>
      <rect x="831" y="256" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="831" y="256" width="6" height="56" fill="#e85d26"/>
      <text x="849" y="291" fill="#0f172a">env.&lt;name&gt;.enc.yaml</text>
    </g>

    <g id="check">
      <text x="150" y="358" fill="#0f172a" font-weight="600">03 // check</text>
      <text x="300" y="358" fill="#475569" font-family="Georgia, 'Times New Roman', serif">every required name, with its type</text>
      <rect x="0" y="376" width="256" height="56" rx="4" fill="#1e293b"/>
      <text x="18" y="411" fill="#f8fafc">manifest.yaml</text>
      <rect x="277" y="376" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="295" y="411" fill="#0f172a">ezc env</text>
      <rect x="554" y="376" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="572" y="411" fill="#0f172a">ezc env export</text>
      <rect x="831" y="376" width="256" height="56" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="849" y="411" fill="#0f172a">ezc run -- cmd</text>
    </g>

    <g id="flow" stroke="#94a3b8" stroke-width="2" fill="none">
      <path d="M259 164H274M268 158l6 6-6 6"/>
      <path d="M536 164H551M545 158l6 6-6 6"/>
      <path d="M813 164H828M822 158l6 6-6 6"/>
      <path d="M959 196V218H124V250M118 244l6 6 6-6"/>
      <path d="M259 284H274M268 278l6 6-6 6"/>
      <path d="M536 284H551M545 278l6 6-6 6"/>
      <path d="M813 284H828M822 278l6 6-6 6"/>
      <path d="M959 316V338H124V370M118 364l6 6 6-6"/>
      <path d="M259 404H274M268 398l6 6-6 6"/>
    </g>

    <g id="legend" font-size="18">
      <rect x="0" y="456" width="6" height="18" fill="#e85d26"/>
      <text x="18" y="471" fill="#475569">encrypted with SOPS + age</text>
    </g>
  </g>
</svg>
